<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>opencode-session-async Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ARCHITECTURE · SESSION SYNC</p>
    <h1>opencode-session-async Plugin Architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sync-arch-en-title sync-arch-en-desc">
        <title id="sync-arch-en-title">opencode-session-async Plugin Architecture</title>
        <desc id="sync-arch-en-desc">Session data flows from the local OpenCode database through the sync engine as gzip snapshots, pushed via git to a GitHub private repository for multi-device synchronization.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <!-- ===== Arrows ===== -->

        <path d="M 232,120 H 308" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="244" y="106" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="270" y="115" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FILES</text>

        <path d="M 492,120 H 548" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="498" y="106" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="115" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GIT</text>

        <path d="M 712,112 H 772" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="716" y="98" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="107" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

        <path d="M 772,132 H 712" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="716" y="138" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="147" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PULL</text>

        <path d="M 400,168 V 236" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="356" y="192" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="201" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP API</text>

        <path d="M 160,236 V 168" fill="none" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="128" y="192" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="160" y="201" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN</text>

        <!-- ===== Nodes ===== -->

        <rect x="64" y="92" width="168" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="0.8"/>
        <text x="148" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">TUI Plugin</text>
        <text x="148" y="128" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tui.ts</text>

        <rect x="308" y="92" width="184" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="400" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Sync Engine</text>
        <text x="400" y="128" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">index.ts</text>

        <rect x="548" y="92" width="164" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="630" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Git Snapshots</text>
        <text x="630" y="128" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">snap/*.json.gz</text>

        <rect x="772" y="92" width="148" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="846" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitHub</text>
        <text x="846" y="128" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">private repo</text>

        <rect x="308" y="236" width="184" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">OpenCode Server</text>
        <text x="400" y="272" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQLite · sessions</text>

        <rect x="64" y="236" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <text x="148" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Credentials</text>
        <text x="148" y="272" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">keychain · token.txt</text>

        <!-- ===== Divider ===== -->
        <line x1="64" y1="332" x2="896" y2="332" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

        <!-- ===== Properties ===== -->
        <text x="480" y="360" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">INCREMENTAL · LAST-WRITER-WINS · AUTO-BACKUP-ROLLBACK</text>
        <text x="480" y="380" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">ONE FILE PER SESSION · GZIP · ~2 MIN INTERVAL</text>

        <!-- ===== Legend ===== -->
        <line x1="280" y1="412" x2="316" y2="412" stroke="#4f5d75" stroke-width="1"/>
        <text x="322" y="416" fill="#5a6580" font-size="8" font-family="'Geist', system-ui, sans-serif">flow</text>
        <line x1="368" y1="412" x2="404" y2="412" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>
        <text x="410" y="416" fill="#5a6580" font-size="8" font-family="'Geist', system-ui, sans-serif">credential</text>
        <line x1="480" y1="412" x2="516" y2="412" stroke="#bf4520" stroke-width="1.2"/>
        <text x="522" y="416" fill="#5a6580" font-size="8" font-family="'Geist', system-ui, sans-serif">push</text>
        <line x1="568" y1="412" x2="604" y2="412" stroke="#2e5aa8" stroke-width="1.2"/>
        <text x="610" y="416" fill="#5a6580" font-size="8" font-family="'Geist', system-ui, sans-serif">HTTP</text>

      </svg>
    </div>
  </div>
</body>
</html>
